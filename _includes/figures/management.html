  <figcaption>
    <strong>Figure 2.</strong> The updater runs beside the agent and shares
    nothing with it but the host. Fleet control never touches
    <code>RawEvents</code>, the processed stream or the database, so an operator
    with dashboard access cannot read collected provenance — and the collection
    path, which holds a write-only Kafka credential, cannot issue installer
    instructions.
