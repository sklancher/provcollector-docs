# ---------------------------------------------------------------------------
# ProvCollector documentation site
#
# Theme: Just the Docs (https://just-the-docs.com/)
# Build: bundle exec jekyll serve
# ---------------------------------------------------------------------------

title: ProvCollector
description: >-
  A distributed system-provenance collection platform. Agents turn OS telemetry
  into a uniform event stream; a backend resolves stable object identities and
  writes a partitioned PostgreSQL provenance graph; analysis tools query and
  visualise it.

# Set these two for wherever the site is published.
#   GitHub Pages project site:  url: "https://<org>.github.io", baseurl: "/provcollector-docs"
#   GitHub Pages user/org site: url: "https://<org>.github.io", baseurl: ""
#   GitLab Pages:               url: "https://<group>.gitlab.io", baseurl: "/provcollector-docs"
url: ""
baseurl: ""

theme: just-the-docs
color_scheme: provcollector

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Just the Docs -------------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

enable_copy_code_button: true

# Breadcrumbs / navigation
nav_external_links:
  - title: Source (GitLab)
    url: https://gitlab.syssec.org/prov-research/provcollector
    hide_icon: false

aux_links:
  "Source":
    - "https://gitlab.syssec.org/prov-research/provcollector"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  ProvCollector — system-provenance collection, storage and analysis.
  Documentation built with <a href="https://jekyllrb.com">Jekyll</a> and
  <a href="https://just-the-docs.com">Just the Docs</a>.

last_edit_timestamp: false

# Diagrams are Mermaid, with sources in _includes/figures/*.mmd. The loader is
# overridden in _includes/components/mermaid.html so the palette follows the
# active colour scheme.
mermaid:
  version: "11.17.2"

# Callout styles used throughout the docs.
callouts_level: quiet
callouts:
  invariant:
    title: Invariant
    color: red
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  rationale:
    title: Why
    color: purple

# --- Site-wide variables used by the pages --------------------------------
repo:
  root: https://gitlab.syssec.org/prov-research/provcollector
  common: https://gitlab.syssec.org/prov-research/provcollector.common
  agent: https://gitlab.syssec.org/prov-research/provcollector.agent
  backend: https://gitlab.syssec.org/prov-research/provcollector.backend
  analysis: https://gitlab.syssec.org/prov-research/provcollector.analysis
  management: https://gitlab.syssec.org/prov-research/provcollector.management

# Jekyll does not merge a theme's own _config.yml, so the default layout has to
# be declared here or pages render with no layout at all.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.bak
  - vendor
  - .jekyll-cache
  - README.md
  - wrangler.toml
